services:
  envoy:
    image: envoyproxy/envoy:v1.30-latest
    container_name: zero-trust-gateway

    ports:
      - "443:443"

    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ./certs:/etc/envoy/certs:ro

    networks:
      - edge_net
      - internal_net

    depends_on:
      - auth-service
      - resource-api

    restart: unless-stopped

  auth-service:
    build:
      context: ../auth_service
      dockerfile: Dockerfile

    container_name: auth-service

    volumes:
      - ./keys:/app/keys:ro

    expose:
      - "8080"

    networks:
      - internal_net

    restart: unless-stopped

  resource-api:
    build:
      context: ../resource-api
      dockerfile: Dockerfile

    container_name: resource-api

    expose:
      - "8080"

    networks:
      - internal_net

    restart: unless-stopped

networks:
  edge_net:
    driver: bridge

  internal_net:
    driver: bridge
    internal: true
