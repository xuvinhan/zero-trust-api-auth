static_resources:
  listeners:
    - name: ingress_edge
      address: { socket_address: { address: 0.0.0.0, port_value: 443 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                # Cấu hình XFCC để truyền chứng chỉ xuống Backend
                forward_client_cert_details: SANITIZE_SET
                set_current_client_cert_details:
                  subject: true
                  cert: true
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: local_service
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/auth/login" }
                          route: { cluster: auth_service_cluster }
                        - match: { prefix: "/api/public" }
                          route: { cluster: resource_api_cluster }
                        - match: { prefix: "/api/protected" }
                          route: { cluster: resource_api_cluster }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config: { "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router }
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_certificates:
                - certificate_chain: { filename: "/etc/envoy/certs/server.crt" }
                  private_key: { filename: "/etc/envoy/certs/server.key" }
                validation_context:
                  trusted_ca: { filename: "/etc/envoy/certs/root-ca.crt" }
  clusters:
    - name: auth_service_cluster
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: auth_service_cluster
        endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: auth-service, port_value: 8080 } } } } ] } ]
    - name: resource_api_cluster
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: resource_api_cluster
        endpoints: [ { lb_endpoints: [ { endpoint: { address: { socket_address: { address: resource-api, port_value: 8080 } } } } ] } ]
